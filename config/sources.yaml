    notes: "RSS全404，用户决定暂不纳入首期"

# =============================================================================
# API 源 (需注册获取 Key)
# =============================================================================
api_sources:
  - name: "财联社"
    base_url: "https://www.cls.cn/v1/roll/get_roll_list"
    category: "hot_industries"
    needs_key: false
    enabled: true
    notes: "SHA1-MD5签名访问，无需API Key。参数: app=CailianpressWeb&os=web&sv=8.4.6"
    method: "api_with_sign"

  - name: "arXiv"
    base_url: "https://export.arxiv.org/api/query"
    category: "science_tech"
    needs_key: false
    enabled: true
    categories:
      - "cs.AI"
      - "q-bio"
      - "cond-mat.mes-hall"
      - "physics.app-ph"
      - "q-fin"

  - name: "FRED (Federal Reserve Economic Data)"
    base_url: "https://api.stlouisfed.org/fred"
    category: "financial_stats"
    needs_key: true
    enabled: false  # 待注册Key后启用

  - name: "东方财富Choice"
    base_url: "https://api.eastmoney.com"
    category: "hot_industries"
    needs_key: true
    enabled: false  # 待注册Key后启用

  - name: "Trading Economics"
    base_url: "https://api.tradingeconomics.com"
    category: "financial_stats"
    needs_key: true
    enabled: false  # 待注册Key后启用

